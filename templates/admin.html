<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>ADMIN - SHOPACC THEPHI</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{background:#0a0a0f;color:#c0c0c0;font-family:monospace;padding:20px}
        .header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a1a2a;padding-bottom:15px;margin-bottom:20px}
        h1{color:#ff5500}
        .btn{padding:8px 16px;background:#ff5500;border:none;border-radius:6px;font-weight:bold;cursor:pointer;color:#fff;text-decoration:none;display:inline-block}
        .btn:hover{background:#ff7733}
        .btn-danger{background:#ff0040}
        .btn-danger:hover{background:#cc0033}
        .btn-edit{background:#00aa55}
        .btn-edit:hover{background:#008844}
        .form-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
        .form-row input,.form-row select{padding:10px;background:#0a0a12;border:1px solid #1a1a2a;border-radius:6px;color:#e0e0e0}
        table{width:100%;border-collapse:collapse;background:#12121a;border-radius:10px;overflow:hidden}
        th,td{padding:10px;text-align:left;border-bottom:1px solid #1a1a2a;font-size:13px}
        th{background:#1a1a2e;color:#ff5500}
        .available{color:#00ff88}
        .sold{color:#ff0040}
        .acc-img{width:50px;height:50px;object-fit:cover;border-radius:6px}
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);z-index:200;justify-content:center;align-items:center}
        .modal-box{background:#12121a;border:1px solid #ff5500;border-radius:12px;padding:30px;max-width:550px;width:90%;max-height:90vh;overflow-y:auto}
        .modal-box h2{color:#ff5500;margin-bottom:15px}
        .modal-box input,.modal-box select{width:100%;padding:10px;margin:6px 0;background:#0a0a12;border:1px solid #1a1a2a;border-radius:6px;color:#e0e0e0;box-sizing:border-box}
        .modal-btns{display:flex;gap:10px;margin-top:15px}
        .modal-btns button{flex:1}
        .preview-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px}
        .preview-grid img{width:100%;height:60px;object-fit:cover;border-radius:6px;cursor:pointer;border:1px solid #2a2a3a}
        .toast{position:fixed;top:20px;right:20px;padding:15px 25px;border-radius:8px;color:#fff;font-weight:bold;z-index:300;display:none}
        .toast.ok{background:#00aa55}
        .toast.err{background:#cc0033}
    </style>
</head>
<body>
    <div class="header">
        <h1>⚙️ ADMIN - SHOPACC THEPHI</h1>
        <a href="/logout" class="btn btn-danger">Đăng xuất</a>
    </div>

    <h3 style="color:#ff5500;margin-bottom:10px">➕ Thêm Acc FF</h3>
    <div class="form-row">
        <input type="text" id="acc_name" placeholder="Tên acc">
        <input type="text" id="acc_username" placeholder="Username FF">
        <input type="number" id="acc_price" placeholder="Giá">
        <input type="text" id="acc_rank" placeholder="Rank">
        <input type="number" id="acc_skin" placeholder="Skin">
        <input type="file" id="acc_image" accept="image/*" multiple>
        <button class="btn" onclick="addAcc()">+ Thêm</button>
    </div>

    <h3 style="color:#ff5500;margin-bottom:10px">📋 Danh sách Acc</h3>
    <table>
        <thead>
            <tr><th>Ảnh</th><th>ID</th><th>Tên</th><th>Username</th><th>Giá</th><th>Trạng thái</th><th>Hành động</th></tr>
        </thead>
        <tbody id="accTable"></tbody>
    </table>

    <div class="modal" id="editModal">
        <div class="modal-box">
            <h2>✏️ Chỉnh sửa Acc</h2>
            <input type="hidden" id="edit_id">
            <input type="text" id="edit_name" placeholder="Tên acc">
            <input type="text" id="edit_username" placeholder="Username">
            <input type="number" id="edit_price" placeholder="Giá">
            <input type="text" id="edit_rank" placeholder="Rank">
            <input type="number" id="edit_skin" placeholder="Skin">
            <select id="edit_status">
                <option value="available">Còn hàng</option>
                <option value="sold">Đã bán</option>
            </select>
            <label style="color:#888;font-size:12px">Đổi ảnh (bỏ trống nếu giữ nguyên):</label>
            <input type="file" id="edit_image" accept="image/*" multiple>
            <div class="preview-grid" id="edit_preview"></div>
            <div class="modal-btns">
                <button class="btn btn-edit" onclick="saveEdit()">💾 Lưu</button>
                <button class="btn btn-danger" onclick="closeEdit()">Hủy</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        function showToast(msg, type='ok'){
            const t = document.getElementById('toast');
            t.textContent = msg; t.className = 'toast '+type;
            t.style.display = 'block';
            setTimeout(()=>t.style.display='none', 3000);
        }

        async function uploadImages(fileInput){
            const files = fileInput.files;
            if(!files || files.length === 0) return [];
            const formData = new FormData();
            for(let i = 0; i < files.length; i++){
                formData.append('files', files[i]);
            }
            const res = await fetch('/api/upload', {method:'POST', body:formData});
            const data = await res.json();
            if(data.success) return data.urls;
            showToast('Lỗi upload: '+data.error, 'err');
            return [];
        }

        async function loadAccs(){
            const res = await fetch('/api/accounts');
            const data = await res.json();
            const tbody = document.getElementById('accTable');
            tbody.innerHTML = '';
            for(const [id, a] of Object.entries(data)){
                const st = a.status==='available' ? '<span class="available">Còn</span>' : '<span class="sold">Đã bán</span>';
                const imgs = a.images || [];
                const img = imgs.length > 0 ? `<img src="${imgs[0]}" class="acc-img">` : '🎮';
                tbody.innerHTML += `<tr>
                    <td>${img}${imgs.length>1?'<span style="color:#888;font-size:11px"> +'+(imgs.length-1)+'</span>':''}</td>
                    <td>${id}</td>
                    <td>${a.name||''}</td>
                    <td>${a.username||''}</td>
                    <td>${(a.price||0).toLocaleString()}đ</td>
                    <td>${st}</td>
                    <td>
                        <button class="btn btn-edit" onclick='openEdit(${JSON.stringify(a).replace(/'/g,"&#39;")})'>Sửa</button>
                        <button class="btn btn-danger" onclick="delAcc('${id}')">Xóa</button>
                    </td>
                </tr>`;
            }
        }

        async function addAcc(){
            const imageUrls = await uploadImages(document.getElementById('acc_image'));
            const payload = {
                name: acc_name.value,
                username: acc_username.value,
                price: parseInt(acc_price.value)||0,
                rank: acc_rank.value,
                skin: parseInt(acc_skin.value)||0,
                images: imageUrls
            };
            await fetch('/api/accounts/add',{
                method:'POST', headers:{'Content-Type':'application/json'},
                body:JSON.stringify(payload)
            });
            showToast('Đã thêm acc!', 'ok');
            loadAccs();
            acc_name.value=''; acc_username.value=''; acc_price.value='';
            acc_rank.value=''; acc_skin.value=''; acc_image.value='';
        }

        async function delAcc(id){
            if(!confirm('Xóa acc '+id+'?')) return;
            await fetch('/api/accounts/delete/'+id,{method:'DELETE'});
            loadAccs();
        }

        function openEdit(acc){
            document.getElementById('edit_id').value = acc.id;
            document.getElementById('edit_name').value = acc.name||'';
            document.getElementById('edit_username').value = acc.username||'';
            document.getElementById('edit_price').value = acc.price||0;
            document.getElementById('edit_rank').value = acc.rank||'';
            document.getElementById('edit_skin').value = acc.skin||0;
            document.getElementById('edit_status').value = acc.status||'available';
            
            const preview = document.getElementById('edit_preview');
            preview.innerHTML = '';
            const imgs = acc.images || [];
            imgs.forEach(url => {
                preview.innerHTML += `<img src="${url}" onclick="window.open('${url}','_blank')">`;
            });
            
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEdit(){ 
            document.getElementById('editModal').style.display='none'; 
            document.getElementById('edit_image').value='';
        }

        async function saveEdit(){
            const id = document.getElementById('edit_id').value;
            const newImages = await uploadImages(document.getElementById('edit_image'));
            const payload = {
                name: document.getElementById('edit_name').value,
                username: document.getElementById('edit_username').value,
                price: parseInt(document.getElementById('edit_price').value)||0,
                rank: document.getElementById('edit_rank').value,
                skin: parseInt(document.getElementById('edit_skin').value)||0,
                status: document.getElementById('edit_status').value
            };
            if(newImages.length > 0) payload.images = newImages;
            const res = await fetch('/api/accounts/edit/'+id,{
                method:'POST', headers:{'Content-Type':'application/json'},
                body:JSON.stringify(payload)
            });
            const data = await res.json();
            if(data.success){ 
                showToast('Đã lưu!', 'ok'); 
                closeEdit(); 
                loadAccs(); 
            }
        }

        loadAccs();
        setInterval(loadAccs, 10000);
    </script>
</body>
</html>
